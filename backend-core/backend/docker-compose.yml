services:
  postgres:
    image: postgres:16
    container_name: vr_postgres_dev
    environment:
      POSTGRES_DB: vr_construction
      POSTGRES_USER: vr_admin
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vr_admin -d vr_construction"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vr_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: vr_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - vr_network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vr_backend_dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vr_admin:SecurePassword123!@postgres:5432/vr_construction
      OLLAMA_URL: http://172.17.0.1:11434
      ENVIRONMENT: development
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - generated_images:/app/generated_images
      - exports:/app/exports
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vr_network
    restart: unless-stopped

volumes:
  postgres_data:
  generated_images:
  exports:
  uploads:
  open-webui_data:
  pgadmin_data:

networks:
  vr_network:
    driver: bridge