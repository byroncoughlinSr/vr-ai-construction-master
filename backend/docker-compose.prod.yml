# Production environment docker-compose
version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16
    container_name: vr_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vr_construction}
      POSTGRES_USER: ${POSTGRES_USER:-vr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vr_admin} -d ${POSTGRES_DB:-vr_construction}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vr_network
    restart: always
    profiles:
      - prod
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: vr_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - vr_network
    restart: always
    profiles:
      - prod
    deploy:
      resources:
        limits:
          memory: 256M

  # Python Backend API (Production)
  backend:
    image: vr-construction-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vr_backend_prod
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vr_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vr_construction}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      GENERATED_IMAGES_DIR: /app/generated_images
      EXPORTS_DIR: /app/exports
      UPLOADS_DIR: /app/uploads
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - generated_images:/app/generated_images
      - exports:/app/exports
      - uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vr_network
    restart: always
    profiles:
      - prod
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vr_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - vr_network
    restart: always
    profiles:
      - prod
    deploy:
      resources:
        limits:
          memory: 128M

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: vr_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - vr_network
    restart: always
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: vr_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - vr_network
    restart: always
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  generated_images:
  exports:
  uploads:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  vr_network:
    driver: bridge
