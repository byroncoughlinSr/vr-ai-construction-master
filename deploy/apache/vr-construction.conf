# VR Construction dashboard on :8081: the built Vue app (backend-core/dashboard/dist,
# `npm run build`) with the backend (uvicorn :8000) behind /api/v1 and its file mounts.
# The headset opens it at BuildConfig.DASHBOARD_URL. Install:
#   sudo cp deploy/apache/vr-construction.conf /etc/apache2/sites-available/
#   sudo a2ensite vr-construction && sudo systemctl reload apache2
# Needs mod_rewrite, mod_headers, mod_proxy, mod_proxy_http and mod_proxy_wstunnel.
Listen 8081

<VirtualHost *:8081>
    # In /etc/hosts on this machine (192.168.4.249 vr-construction); the headset uses the IP.
    ServerName vr-construction
    DocumentRoot /development/vr-ai-construction-project/backend-core/dashboard/dist

    <Directory /development/vr-ai-construction-project/backend-core/dashboard/dist>
        Require all granted
        Options -Indexes
        AllowOverride None

        # Vue router uses HTML5 history: unknown paths get the app.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Assets have hashed names; index.html must be re-read after every rebuild.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ProxyPreserveHost On
    ProxyRequests Off
    # Plan generation and refines take up to 200 s (PLANNING_TIMEOUT_SECONDS).
    ProxyTimeout 300

    # WebSockets before the plain /api/v1/ rule, which would otherwise take them.
    ProxyPass        /api/v1/ws/ ws://127.0.0.1:8000/api/v1/ws/
    ProxyPassReverse /api/v1/ws/ ws://127.0.0.1:8000/api/v1/ws/
    ProxyPass        /api/v1/    http://127.0.0.1:8000/api/v1/
    ProxyPassReverse /api/v1/    http://127.0.0.1:8000/api/v1/

    # Files the backend serves outside /api/v1 (renders, exports, photos, plant/furniture models).
    ProxyPass        /generated_images/ http://127.0.0.1:8000/generated_images/
    ProxyPassReverse /generated_images/ http://127.0.0.1:8000/generated_images/
    ProxyPass        /exports/          http://127.0.0.1:8000/exports/
    ProxyPassReverse /exports/          http://127.0.0.1:8000/exports/
    ProxyPass        /uploads/          http://127.0.0.1:8000/uploads/
    ProxyPassReverse /uploads/          http://127.0.0.1:8000/uploads/
    ProxyPass        /plant_models/     http://127.0.0.1:8000/plant_models/
    ProxyPassReverse /plant_models/     http://127.0.0.1:8000/plant_models/

    ErrorLog  ${APACHE_LOG_DIR}/vr_construction_error.log
    CustomLog ${APACHE_LOG_DIR}/vr_construction_access.log combined
</VirtualHost>
